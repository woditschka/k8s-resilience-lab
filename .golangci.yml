# Lint configuration for the lab. Beyond the standard linters, the enabled set
# is the one `make lint-fix` can fix, plus depguard and forbidigo, which carry
# the module rules.
version: "2"

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - forbidigo
    - godot
    - modernize
    - perfsprint
    - revive

  settings:
    depguard:
      rules:
        # The layering rule: a run's description, its observed outcome and where
        # its Timeline is kept are the lab's own, naming no Kubernetes type, so
        # the mapping between the two vocabularies stays inside internal/cluster.
        values-stay-kubernetes-free:
          files:
            - "**/internal/scenario/**"
            - "**/internal/timeline/**"
          deny:
            - pkg: k8s.io
              desc: internal/scenario and internal/timeline import no Kubernetes package; Kubernetes types stay inside internal/cluster

        # The Scenario rule: a Scenario source is Steps alone, so it reaches the
        # Step surface and the pod and node packages beneath it, and nothing else
        # of the lab. It keeps the place an engineer finds the experiments in from
        # re-accumulating machinery; the lax list mode admits the three packages,
        # since no deny entry below names them.
        scenarios-hold-steps-alone:
          list-mode: lax
          files:
            - "**/scenarios/**"
          # The one stated exception to the read-by-subject rule: a Scenario
          # reaching a Pod setting the lab's own vocabulary does not name writes
          # full access, which names that setting under the Kubernetes package
          # declaring it. The lax list mode makes the allowed path an exception
          # to the k8s.io denial below rather than the only import this place may
          # hold: under the default mode a non-empty allow list denies every path
          # it leaves out.
          allow:
            - k8s.io/api/core/v1
          deny:
            - pkg: github.com/woditschka/k8s-resilience-lab/internal/cluster
              desc: a Scenario reaches the Simulated Cluster through its Steps; internal/lab is the one package naming both
            - pkg: github.com/woditschka/k8s-resilience-lab/internal/scenario
              desc: a Scenario declares through its Given Steps; the immutable values they construct stay behind internal/lab
            - pkg: github.com/woditschka/k8s-resilience-lab/internal/expect
              desc: a Scenario judges through its Then Steps; the assertion helper stays behind internal/lab
            - pkg: github.com/woditschka/k8s-resilience-lab/internal/modulerules
              desc: the module-rule helpers are for test files, and the rules governing the Scenarios live with the machinery
            - pkg: k8s.io
              desc: a Scenario names a Kubernetes type only through the full access it writes, which is the Pod settings package allowed above; every other Kubernetes type stays inside internal/cluster

        # The Live view rule: the Live view shows the lab's own Placement board,
        # so it reaches nothing that drives a Simulated Cluster, and the command
        # alone composes it.
        live-view-shows-the-board-alone:
          files:
            - "**/internal/live/**"
          deny:
            - pkg: k8s.io
              desc: internal/live imports internal/scenario and the standard library alone; Kubernetes types stay inside internal/cluster
            - pkg: github.com/woditschka/k8s-resilience-lab/internal/cluster
              desc: the Live view is handed its board by the observer and reaches no Simulated Cluster itself
            - pkg: github.com/woditschka/k8s-resilience-lab/internal/lab
              desc: the command composes the held run and the Live view; neither imports the other
            - pkg: github.com/woditschka/k8s-resilience-lab/internal/timeline
              desc: the Live view shows the Placement board alone
        live-view-composed-by-the-command-alone:
          files:
            - "**/internal/**"
            - "**/scenarios/**"
          deny:
            - pkg: github.com/woditschka/k8s-resilience-lab/internal/live
              desc: cmd/lab alone composes the Live view

        # The credential rule, module-wide: the lab drives only the Simulated
        # Cluster it provisioned itself, so no package may reach a kubeconfig, a
        # home directory holding one, or a credential plugin.
        no-cluster-credential-discovery:
          deny:
            - pkg: k8s.io/client-go/tools/clientcmd
              desc: the lab reads no kubeconfig; the client is built from the address the lab provisioned, with no credential
            - pkg: k8s.io/client-go/util/homedir
              desc: locating a home directory is the first step of kubeconfig discovery, which the lab never performs
            - pkg: k8s.io/client-go/plugin/pkg/client/auth
              desc: credential plugins authenticate against a cluster the lab did not provision

    # In-cluster configuration is denied as a *call*, not as an import: it is a
    # function in k8s.io/client-go/rest, the same package a client built from a
    # provisioned address needs, so depguard cannot carry this half.
    forbidigo:
      # analyze-types resolves the call through the type checker instead of
      # matching source text, so an import alias cannot defeat the rule:
      # `import k8srest "k8s.io/client-go/rest"` still expands to
      # `rest.InClusterConfig`. `pkg` pins the match to that import path, so
      # the rule cannot be tripped by an unrelated package also named `rest`.
      analyze-types: true
      forbid:
        - pattern: ^rest\.InClusterConfig$
          pkg: ^k8s\.io/client-go/rest$
          msg: the lab reads no service-account token; the client is built from the address the lab provisioned

    revive:
      rules:
        - name: unused-parameter
        - name: unused-receiver
        - name: redefines-builtin-id
