# Lint configuration for the lab, including the two module rules
# docs/system-design.md § Package Structure states (REQ-SIM-004).
#
# The enabled set beyond the standard linters is the one CLAUDE.md § Lint
# Troubleshooting documents as fixable by `make lint-fix`, plus depguard and
# forbidigo, which carry the module rules.
version: "2"

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - forbidigo
    - godot
    - modernize
    - perfsprint
    - revive

  settings:
    depguard:
      rules:
        # The layering rule: a run's description, its observed outcome and where
        # its Timeline is kept are the lab's own, naming no Kubernetes type, so
        # the mapping between the two vocabularies stays inside internal/cluster.
        values-stay-kubernetes-free:
          files:
            - "**/internal/scenario/**"
            - "**/internal/timeline/**"
          deny:
            - pkg: k8s.io
              desc: internal/scenario and internal/timeline import no Kubernetes package; Kubernetes types stay inside internal/cluster (docs/system-design.md § Package Structure)

        # The Scenario rule: a Scenario source is Steps alone, so it reaches the
        # Step surface and nothing else of the lab. It keeps the place an engineer
        # finds the experiments in from re-accumulating machinery.
        scenarios-hold-steps-alone:
          files:
            - "**/scenarios/**"
          deny:
            - pkg: github.com/woditschka/k8s-resilience-lab/internal/cluster
              desc: a Scenario reaches the Simulated Cluster through its Steps; internal/lab is the one package naming both (docs/system-design.md § Package Structure)
            - pkg: github.com/woditschka/k8s-resilience-lab/internal/scenario
              desc: a Scenario declares through its Given Steps; the immutable values they construct stay behind internal/lab (docs/system-design.md § Package Structure)
            - pkg: github.com/woditschka/k8s-resilience-lab/internal/expect
              desc: a Scenario judges through its Then Steps; the assertion helper stays behind internal/lab (docs/system-design.md § Package Structure)
            - pkg: github.com/woditschka/k8s-resilience-lab/internal/modulerules
              desc: the module-rule helpers are for test files, and the rules governing the Scenarios live with the machinery (docs/adr/2026-10-04-module-rule-test-support.md)
            - pkg: k8s.io
              desc: a Scenario names no Kubernetes type; Kubernetes types stay inside internal/cluster (docs/system-design.md § Package Structure)

        # The credential rule, module-wide: the lab drives only the Simulated
        # Cluster it provisioned itself, so no package may reach a kubeconfig, a
        # home directory holding one, or a credential plugin. NG-1 made mechanical.
        no-cluster-credential-discovery:
          deny:
            - pkg: k8s.io/client-go/tools/clientcmd
              desc: the lab reads no kubeconfig; the client is built from the address the lab provisioned, with no credential (docs/system-design.md § Threat Model)
            - pkg: k8s.io/client-go/util/homedir
              desc: locating a home directory is the first step of kubeconfig discovery, which the lab never performs (docs/system-design.md § Threat Model)
            - pkg: k8s.io/client-go/plugin/pkg/client/auth
              desc: credential plugins authenticate against a cluster the lab did not provision (docs/system-design.md § Threat Model)

    # § Package Structure denies in-cluster configuration as a *call*, not as an
    # import: it is a function in k8s.io/client-go/rest, the same package a client
    # built from a provisioned address needs, so depguard cannot carry this half.
    forbidigo:
      # analyze-types resolves the call through the type checker instead of
      # matching source text, so an import alias cannot defeat the rule:
      # `import k8srest "k8s.io/client-go/rest"` still expands to
      # `rest.InClusterConfig`. `pkg` pins the match to that import path, so
      # the rule cannot be tripped by an unrelated package also named `rest`.
      analyze-types: true
      forbid:
        - pattern: ^rest\.InClusterConfig$
          pkg: ^k8s\.io/client-go/rest$
          msg: the lab reads no service-account token; the client is built from the address the lab provisioned (docs/system-design.md § Threat Model)

    # The three rules CLAUDE.md § Lint Troubleshooting documents for this project.
    revive:
      rules:
        - name: unused-parameter
        - name: unused-receiver
        - name: redefines-builtin-id
